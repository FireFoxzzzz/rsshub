services:
  rsshub:
    image: diygod/rsshub:chromium-bundled
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # env_file:
    #   - /etc/rsshub/.env
    restart: always
    ports:
      - '127.0.0.2:1200:1200'
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: 'redis://redis:6379/'
    mem_limit: 768m
    memswap_limit: 768m
    mem_swappiness: 20
    cpus: 0.8
    pids_limit: 256
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:1200/healthz']
      interval: 60s
      timeout: 10s
      retries: 3
    depends_on:
      - redis
    volumes:
      - /etc/ssl:/etc/ssl:ro

  redis:
    image: redis:alpine
    # 可选：如果你也希望 redis 自动更新，取消注释
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s

volumes:
  redis-data:

